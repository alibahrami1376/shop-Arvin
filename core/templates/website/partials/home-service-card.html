<article class="home-service-card{% if highlight %} home-service-card--highlight{% endif %}">
    <div class="home-service-card__icon-wrap">
        <i class="{{ icon_class }}" aria-hidden="true"></i>
    </div>
    <h3 class="home-service-card__title">{{ title }}</h3>
    <p class="home-service-card__desc">{{ description }}</p>
</article>
