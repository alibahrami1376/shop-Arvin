{% extends dashboard_admin_base_template %}
{% load static %}

{% block breadcrumb %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb breadcrumb-light mb-0">
        <li class="breadcrumb-item">حساب</li>
        <li class="breadcrumb-item">داشبورد ادمین</li>
        <li class="breadcrumb-item"><a href="{% url 'dashboard:admin:blog-category-list' %}">دسته‌بندی بلاگ</a></li>
        <li class="breadcrumb-item active" aria-current="page">حذف</li>
    </ol>
</nav>
{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header border-bottom">
        <h5 class="card-header-title">حذف دسته‌بندی بلاگ</h5>
    </div>
    <div class="card-body">
        <p class="mb-0">آیا از حذف دسته‌بندی زیر مطمئن هستید؟</p>
        <div class="mt-3">
            <strong>{{ object.name }}</strong>
        </div>
    </div>
    <div class="card-footer">
        <form action="." method="post" class="d-flex pt-2 justify-content-end">
            {% csrf_token %}
            <a class="btn btn-secondary ms-3" href="{% url 'dashboard:admin:blog-category-list' %}">انصراف</a>
            <button class="btn btn-danger ms-3" type="submit">حذف</button>
        </form>
    </div>
</div>
{% endblock %}
