{% extends 'dashboard/admin/base.html' %}
{% load static %}

{% block breadcrumb %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb breadcrumb-light mb-0">
        <li class="breadcrumb-item">حساب</li>
        <li class="breadcrumb-item">داشبورد ادمین</li>
        <li class="breadcrumb-item"><a href="{% url 'dashboard:admin:blog-category-list' %}">دسته‌بندی بلاگ</a></li>
        <li class="breadcrumb-item active" aria-current="page">ویرایش</li>
    </ol>
</nav>
{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header border-bottom">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="card-header-title">ویرایش دسته‌بندی بلاگ</h5>
            <a class="btn btn-outline-danger" href="{% url 'dashboard:admin:blog-category-delete' pk=object.pk %}">حذف</a>
        </div>
    </div>
    <form action="." method="post">
        {% csrf_token %}
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>نام</label>
                    {{ form.name }}
                </div>
            </div>
        </div>
        <div class="card-footer">
            <div class="d-flex pt-3 justify-content-end">
                <a class="btn btn-secondary ms-3" href="{% url 'dashboard:admin:blog-category-list' %}">بازگشت</a>
                <button class="btn btn-primary ms-3" type="submit">ذخیره تغییرات</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
