{% load static %}
<div class="card-header border-bottom">
  <h5 class="card-header-title">آدرس های من</h5>
</div>

<div class="card-body">
  <div class="row">
    {% for object in object_list %}
    <div class="col-sm-12 mb-5 mb-sm-7">
      <div class="w-100 h-100">
        <span class="h5 d-block">آدرس شماره {{ object.id }}</span>
        <span class="d-block mb-2">{{ object.state }},{{ object.city }},{{ object.address }} ,{{ object.zip_code }}</span>
        <div class="d-flex flex-wrap gap-2">
          <a class="btn btn-white btn-xs" href="{% url 'dashboard:customer:address-edit' pk=object.pk %}">
            <i class="bi-pencil-fill me-1"></i> آدرس را ویرایش کنید
          </a>
          <form action="{% url 'dashboard:customer:address-delete' pk=object.pk %}"
            method="post"
            class="d-inline"
            hx-post="{% url 'dashboard:customer:address-delete' pk=object.pk %}"
            hx-target="#customer-address-list-root"
            hx-swap="outerHTML"
            hx-confirm="این آدرس حذف شود؟">
            {% csrf_token %}
            <button class="btn btn-outline-danger btn-xs" type="submit">
              <i class="bi-trash me-1"></i> حذف
            </button>
          </form>
        </div>
      </div>
    </div>
    {% empty %}
    <div class="col-12 mb-4 text-secondary">هنوز آدرسی ثبت نکرده‌اید.</div>
    {% endfor %}

    <div class="col-sm-12 mb-5 mb-sm-7">
      <a class="card card-dashed card-centered" href="{% url 'dashboard:customer:address-create' %}">
        <div class="card-body card-dashed-body py-8">
          <img class="avatar avatar-lg avatar-4x3 mb-2" src="{% static '/svg/illustrations/oc-address.svg' %}"
            alt="افزودن آدرس جدید" />
          <span class="d-block"><i class="bi-plus"></i> یک آدرس جدید اضافه کنید</span>
        </div>
      </a>
    </div>
  </div>
</div>
