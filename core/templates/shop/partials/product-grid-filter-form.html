<form action="." class="shop-filter-form w-100" id="shopFilterForm">
    <div class="shop-filter-form__section">
        <label class="form-label" for="search-query-filter">جستجو</label>
        <input class="form-control" placeholder="نام محصول..." type="text" name="q" id="search-query-filter" value="{{ request.GET.q|default:'' }}">
    </div>

    <div class="shop-filter-form__section">
        <span class="form-label d-block mb-2">محدوده قیمت (تومان)</span>
        <div class="row g-2">
            <div class="col-6">
                <input class="form-control" type="number" name="min_price" placeholder="از" id="min-price-filter" value="{{ request.GET.min_price|default:'' }}">
            </div>
            <div class="col-6">
                <input class="form-control" type="number" name="max_price" placeholder="تا" id="max-price-filter" value="{{ request.GET.max_price|default:'' }}">
            </div>
        </div>
    </div>

    <div class="shop-filter-form__section">
        <label class="form-label" for="category-id-filter">دسته‌بندی</label>
        <select class="form-select" name="category_id" id="category-id-filter">
            <option value="">همه دسته‌ها</option>
            {% for category in categories %}
            <option value="{{ category.id }}"{% if request.GET.category_id == category.id|stringformat:"s" %} selected{% endif %}>{{ category.title }}</option>
            {% endfor %}
        </select>
    </div>


    <div class="shop-filter-form__actions d-grid gap-2">
        <button type="submit" class="btn btn-primary">اعمال فیلتر</button>
        <a href="{% url 'shop:product-grid' %}" class="btn btn-outline-secondary">پاک کردن فیلترها</a>
    </div>
</form>
