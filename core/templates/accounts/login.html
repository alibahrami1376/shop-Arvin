{% extends base_template %}

{% block content %}
<div class="container auth-page">
    <div class="auth-page__card mx-auto">
        <header class="auth-page__header text-center">
            <h1 class="auth-page__title h2">فرم ورود</h1>
            <p class="auth-page__subtitle mb-0">برای مدیریت حساب خود وارد شوید.</p>
        </header>

        <form class="auth-form" action="{% url 'accounts:login' %}" method="post" novalidate>
            {% csrf_token %}

            <div class="auth-form__field mb-4">
                <label class="form-label" for="signupSimpleLoginEmail">ایمیل شما</label>
                <input type="email" class="form-control form-control-lg auth-form__input auth-form__input--ltr"
                    name="username" id="signupSimpleLoginEmail" placeholder="email@site.com" required
                    autocomplete="email" inputmode="email" spellcheck="false">
            </div>

            <div class="auth-form__field mb-4">
                <label class="form-label" for="signupSimpleLoginPassword">کلمه عبور</label>
                <div class="auth-field-password">
                    <input type="password" class="form-control form-control-lg auth-form__input" name="password"
                        id="signupSimpleLoginPassword" placeholder="رمز عبور" required
                        autocomplete="current-password">
                    <button type="button" class="auth-field-password__toggle js-password-toggle"
                        aria-label="نمایش رمز عبور" aria-controls="signupSimpleLoginPassword">
                        <i class="bi-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <div class="auth-form__actions">
                <p class="text-center mb-3">
                    <a class="auth-form__forgot-link" href="./page-reset-password-simple.html">رمز عبور را فراموش کرده‌اید؟</a>
                </p>
                <button type="submit" class="btn btn-primary btn-lg w-100">ورود</button>
            </div>

            <p class="auth-form__footer text-center mb-0">
                حساب کاربری ندارید؟ <a class="link" href="{% url 'accounts:register' %}">اینجا ثبت‌نام کنید</a>
            </p>
        </form>
    </div>
</div>
{% endblock content %}

{% block extra_js %}{% endblock extra_js %}
