stages:
  - deploy

deploy_production:
  stage: deploy
  image: alpine:latest  # یک ایمیج سبک برای اجرای دستورات SSH
  
  before_script:
    # نصب SSH Client
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    
    # اضافه کردن کلید خصوصی (که به صورت File تعریف شده)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    
    # تایید هویت سرور مقصد
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $SERVER_HOST >> ~/.ssh/known_hosts

  script:
    - echo "Deploying to Docker container on $SERVER_HOST..."
    - ssh $SERVER_USER@$SERVER_HOST "
        cd $PROJECT_PATH &&
        git pull origin main &&
        docker compose up -d --build &&
        docker image prune -f
      "
    - echo "Deployment finished successfully!"

  only:
    - production
