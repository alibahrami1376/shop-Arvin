services:
  backend:
    build: .
    container_name: shop_arvin_backend
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    networks:
      - web
    restart: always

  nginx:
    image: nginx:stable
    container_name: shop_arvin_nginx
    restart: always
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - backend
    networks:
      - web

volumes:
  static_volume:
  media_volume:

networks:
  web:
    external: true

